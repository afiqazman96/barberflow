<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clear BarberFlow Cache</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #0c0b09;
        color: #f5f0e8;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
      }
      .box {
        max-width: 28rem;
        padding: 2rem;
        border: 1px solid #2e2a24;
        border-radius: 1rem;
        background: #1a1814;
        text-align: center;
      }
      a {
        color: #c9a227;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Clearing cache…</h1>
      <p id="status">Unregistering service workers</p>
      <p><a href="/">Go to BarberFlow</a></p>
    </div>
    <script>
      (async function () {
        const status = document.getElementById("status");
        try {
          if ("serviceWorker" in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map((r) => r.unregister()));
            status.textContent = "Service workers removed";
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((k) => caches.delete(k)));
            status.textContent = "Cache cleared. Redirecting…";
          }
        } catch (e) {
          status.textContent = "Cleanup done (with warnings). Redirecting…";
        }
        setTimeout(function () {
          location.replace("/?nocache=" + Date.now());
        }, 600);
      })();
    </script>
  </body>
</html>
