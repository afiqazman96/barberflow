services:
  postgres:
    image: postgres:17-alpine
    container_name: barberflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberflow
      POSTGRES_PASSWORD: barberflow
      POSTGRES_DB: barberflow
    ports:
      - "5432:5432"
    volumes:
      - barberflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberflow -d barberflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  barberflow-pgdata:
